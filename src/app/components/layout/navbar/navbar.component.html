<header class="fixed top-0 right-0 left-64 h-20 bg-white shadow-md z-40">
  <div class="flex items-center justify-between h-full px-8">
    <!-- Search Bar -->
    <div class="flex-1 max-w-2xl">
      <div class="relative">
        <input
          type="text"
          placeholder="Buscar..."
          class="w-full px-4 py-2 pl-10 pr-4 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        />
        <i class="fas fa-search absolute left-3 top-3 text-slate-400"></i>
      </div>
    </div>

    <!-- User Menu -->
    <div class="flex items-center space-x-4">
      <!-- Notifications -->
      <button class="relative p-2 text-slate-600 hover:text-slate-900 hover:bg-slate-100 rounded-lg transition-colors">
        <i class="fas fa-bell text-xl"></i>
        <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
      </button>

      <!-- User Profile -->
      <div class="relative">
        <button
          (click)="toggleUserMenu()"
          class="flex items-center space-x-3 p-2 hover:bg-slate-100 rounded-lg transition-colors"
        >
          <div class="w-10 h-10 rounded-full bg-gradient-to-r from-blue-500 to-purple-600 flex items-center justify-center text-white font-bold">
            {{ currentUser?.user?.name?.charAt(0) || 'A' }}
          </div>
          <div class="text-left hidden md:block">
            <p class="text-sm font-semibold text-slate-700">
              {{ currentUser?.user?.name || 'Admin' }}
            </p>
            <p class="text-xs text-slate-500">Administrador</p>
          </div>
          <i class="fas fa-chevron-down text-slate-400 text-sm"></i>
        </button>

        <!-- Dropdown Menu -->
        @if (showUserMenu) {
          <div class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-xl border border-slate-200 py-2">
            <a href="#" class="block px-4 py-2 text-sm text-slate-700 hover:bg-slate-100">
              <i class="fas fa-user mr-2"></i> Mi Perfil
            </a>
            <a href="#" class="block px-4 py-2 text-sm text-slate-700 hover:bg-slate-100">
              <i class="fas fa-cog mr-2"></i> Configuración
            </a>
          </div>
        }
      </div>
    </div>
  </div>
</header>
