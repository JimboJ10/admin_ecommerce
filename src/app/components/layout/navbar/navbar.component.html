<header class="fixed top-0 right-0 left-64 h-20 bg-white shadow-md z-40">
  <div class="flex items-center justify-between h-full px-8">
    <!-- Título o Logo -->
    <div class="flex items-center space-x-4">
      <h2 class="text-2xl font-bold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">
        Panel de Administración
      </h2>
    </div>

    <!-- User Menu -->
    <div class="flex items-center space-x-4">

      <!-- User Profile -->
      <div class="relative">
        <button
          (click)="toggleUserMenu()"
          class="flex items-center space-x-3 p-2 hover:bg-slate-100 rounded-lg transition-colors"
        >
          <div class="w-10 h-10 rounded-full bg-gradient-to-r from-blue-500 to-purple-600 flex items-center justify-center text-white font-bold">
            {{ currentUser?.user?.name?.charAt(0) || 'A' }}
          </div>
          <div class="text-left hidden md:block">
            <p class="text-sm font-semibold text-slate-700">
              {{ currentUser?.user?.name || 'Admin' }}
            </p>
            <p class="text-xs text-slate-500">Administrador</p>
          </div>
          <i class="fas fa-chevron-down text-slate-400 text-sm"></i>
        </button>

        <!-- Dropdown Menu -->
        @if (showUserMenu) {
          <div class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-xl border border-slate-200 py-2">
            <!-- <a href="#" class="block px-4 py-2 text-sm text-slate-700 hover:bg-slate-100 transition-colors">
              <i class="fas fa-user mr-2 text-blue-500"></i> Mi Perfil
            </a>
            <a href="#" class="block px-4 py-2 text-sm text-slate-700 hover:bg-slate-100 transition-colors">
              <i class="fas fa-cog mr-2 text-slate-500"></i> Configuración
            </a> -->
            <!-- <div class="border-t border-slate-200 my-2"></div> -->
            <button
              (click)="logout()"
              class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 transition-colors font-semibold rounded-lg"
            >
              <i class="fas fa-sign-out-alt mr-2"></i> Cerrar Sesión
            </button>
          </div>
        }
      </div>
    </div>
  </div>
</header>
