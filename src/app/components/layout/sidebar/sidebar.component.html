<aside class="fixed left-0 top-0 h-screen w-64 bg-gradient-to-b from-slate-900 to-slate-800 text-white shadow-2xl z-50">
  <!-- Logo -->
  <div class="flex items-center justify-center h-20 border-b border-slate-700">
    <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">
      Admin Panel
    </h1>
  </div>

  <!-- Menu -->
  <nav class="mt-6 px-4 overflow-y-auto h-[calc(100vh-140px)]">
    <ul class="space-y-2">
      @for (item of menuItems; track item.title) {
        <li>
          @if (item.submenu) {
            <!-- Menu con submenu -->
            <button
              (click)="toggleSubmenu(item)"
              class="w-full flex items-center justify-between px-4 py-3 rounded-lg hover:bg-slate-700/50 transition-all duration-200 group"
            >
              <div class="flex items-center space-x-3">
                <i [class]="'fas ' + item.icon + ' text-slate-400 group-hover:text-blue-400 transition-colors'"></i>
                <span class="font-medium">{{ item.title }}</span>
              </div>
              <i 
                class="fas fa-chevron-down transition-transform duration-200"
                [class.rotate-180]="item.expanded"
              ></i>
            </button>
            
            <!-- Submenu -->
            <ul 
              class="ml-4 mt-2 space-y-1 overflow-hidden transition-all duration-300"
              [class.max-h-0]="!item.expanded"
              [class.max-h-96]="item.expanded"
            >
              @for (subitem of item.submenu; track subitem.title) {
                <li>
                  <a
                    [routerLink]="subitem.route"
                    routerLinkActive="bg-blue-600/20 text-blue-400 border-l-4 border-blue-500"
                    class="flex items-center px-4 py-2 rounded-lg hover:bg-slate-700/30 transition-all"
                  >
                    <span class="text-sm">{{ subitem.title }}</span>
                  </a>
                </li>
              }
            </ul>
          } @else {
            <!-- Menu simple -->
            <a
              [routerLink]="item.route"
              routerLinkActive="bg-blue-600/20 text-blue-400 border-l-4 border-blue-500"
              class="flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-slate-700/50 transition-all duration-200 group"
            >
              <i [class]="'fas ' + item.icon + ' text-slate-400 group-hover:text-blue-400 transition-colors'"></i>
              <span class="font-medium">{{ item.title }}</span>
            </a>
          }
        </li>
      }
    </ul>
  </nav>

  <!-- Logout Button -->
  <div class="absolute bottom-0 left-0 right-0 p-4 border-t border-slate-700">
    <button
      (click)="logout()"
      class="w-full flex items-center justify-center space-x-2 px-4 py-3 bg-red-600 hover:bg-red-700 rounded-lg transition-colors"
    >
      <i class="fas fa-sign-out-alt"></i>
      <span class="font-medium">Cerrar Sesión</span>
    </button>
  </div>
</aside>
